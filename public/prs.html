<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pull Requests · Switchyard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Switchyard</h1>
      <nav class="nav" aria-label="Pages">
        <a href="/">Agents <span class="nav-badge" data-badge="agents" hidden></span></a>
        <a href="/worktrees">Worktrees</a>
        <a href="/prs" aria-current="page">Pull requests <span class="nav-badge" data-badge="prs" hidden></span></a>
      </nav>
    </div>
    <div class="topbar-actions">
      <span id="updated" class="muted" aria-live="polite">Loading…</span>
      <button id="refresh" type="button" class="btn">Refresh</button>
    </div>
  </header>

  <main>
    <div id="errors" class="errors" hidden></div>

    <section class="tiles" id="tiles" aria-label="Summary"></section>

    <section class="panel" aria-labelledby="authored-title">
      <div class="panel-head">
        <h2 id="authored-title">My pull requests</h2>
        <div class="filters">
          <input id="search" type="search" placeholder="Filter title, repo, branch, author…" aria-label="Filter pull requests">
        </div>
      </div>
      <div id="authored"></div>
    </section>

    <section class="panel" aria-labelledby="review-title">
      <div class="panel-head">
        <h2 id="review-title">Review requested from you</h2>
        <span id="review-count" class="muted"></span>
      </div>
      <div id="review"></div>
    </section>

    <section class="panel" aria-labelledby="team-title">
      <details id="team-details">
        <summary class="panel-head team-summary">
          <h2 id="team-title">Requested from your teams</h2>
          <span id="team-count" class="muted"></span>
        </summary>
        <ul id="team" class="list"></ul>
      </details>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/prs.js"></script>
</body>
</html>
