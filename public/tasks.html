<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks · Switchyard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Switchyard</h1>
      <nav class="nav" aria-label="Pages">
        <a href="/">Agents <span class="nav-badge" data-badge="agents" hidden></span></a>
        <a href="/worktrees">Worktrees</a>
        <a href="/prs">Pull requests <span class="nav-badge" data-badge="prs" hidden></span></a>
        <a href="/tasks" aria-current="page">Tasks</a>
      </nav>
    </div>
    <div class="topbar-actions">
      <span id="connections"></span>
      <span id="updated" class="muted" aria-live="polite">Loading…</span>
      <button id="refresh" type="button" class="btn">Refresh</button>
    </div>
  </header>

  <main>
    <div id="errors" class="errors" hidden></div>

    <section class="panel hub" aria-labelledby="tasks-title">
      <div class="panel-head">
        <h2 id="tasks-title">Tasks</h2>
        <div class="filters">
          <span id="task-count" class="muted"></span>
          <input id="search" type="search" placeholder="Filter title, id, notes, link, branch…" aria-label="Filter tasks">
        </div>
      </div>
      <div id="new-task"></div>
      <div id="tasks"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/tasks.js"></script>
</body>
</html>
