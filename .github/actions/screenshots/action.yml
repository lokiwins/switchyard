name: Capture and compare screenshots
description: >
  Runs switchyard at two commits against the made-up data in scripts/screenshots,
  screenshots every scene, and compares them. The checkout must be the head commit
  with full history.

inputs:
  base:
    description: Commit to compare against. Empty means there is none, so every scene is new.
    required: false
    default: ''
outputs:
  report:
    description: Path of report.json (which scenes are new, changed, same, failed or removed)
    value: ${{ steps.compare.outputs.report }}
  shots:
    description: Directory holding base/ and head/ screenshots
    value: ${{ steps.capture.outputs.shots }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        # npm's download cache, keyed on the screenshots' lockfile.
        cache: npm
        cache-dependency-path: scripts/screenshots/package-lock.json

    - name: Find the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('./scripts/screenshots/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

    # The browser Playwright drives, kept between runs: a new Playwright version is a new key.
    - name: Cache Playwright's browser
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Playwright and tmux
      shell: bash
      working-directory: scripts/screenshots
      env:
        BROWSER_CACHED: ${{ steps.browsers.outputs.cache-hit }}
      run: |
        # A dropped connection to Ubuntu's mirrors is tried again rather than failing the job.
        echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
        npm ci --no-audit --no-fund
        [ "$BROWSER_CACHED" = true ] || npx playwright install --only-shell chromium
        # The runner image has Chrome, so it has the browser's libraries already. Only if the
        # browser can't start are they installed, from Ubuntu's mirrors.
        if ! node -e "import('playwright').then(async ({ chromium }) => { await (await chromium.launch()).close(); })"; then
          echo "::notice::Chromium needs system libraries the runner lacks; installing them"
          npx playwright install-deps chromium
        fi
        # New task only appears when tmux is installed.
        command -v tmux >/dev/null || sudo apt-get install -y --no-install-recommends tmux
        # The page shows /home/<name>/… as ~/…, so the fixtures live in a home of their own.
        sudo mkdir -p /home/dev
        sudo chown "$(id -u):$(id -g)" /home/dev

    - name: Check out the base commit
      if: inputs.base != ''
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

    - name: Capture
      id: capture
      shell: bash
      working-directory: scripts/screenshots
      env:
        BASE: ${{ inputs.base }}
      run: |
        shots="$RUNNER_TEMP/shots"
        apps=("head=$GITHUB_WORKSPACE")
        [ -n "$BASE" ] && apps=("base=$RUNNER_TEMP/base" "${apps[@]}")
        node capture.mjs --home /home/dev --out "$shots" "${apps[@]}"
        echo "shots=$shots" >> "$GITHUB_OUTPUT"

    - name: Compare
      id: compare
      shell: bash
      working-directory: scripts/screenshots
      env:
        SHOTS: ${{ steps.capture.outputs.shots }}
      run: |
        node compare.mjs --base "$SHOTS/base" --head "$SHOTS/head" --out "$SHOTS/report.json"
        echo "report=$SHOTS/report.json" >> "$GITHUB_OUTPUT"
