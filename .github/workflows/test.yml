name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every Node version package.json supports, on Linux; macOS, where switchyard runs, on the newest.
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 24
    steps:
      # Actions are pinned to the commit of a release tag, which can't be moved later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # No dependencies, so nothing to cache.
          package-manager-cache: false
      - run: npm test
