name: Screenshots

# Shows a PR what it changes on screen: every scene in scripts/screenshots is
# captured at the PR's merge base and at its head, and a sticky comment shows
# the ones that look different, before and after.
on:
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/screenshots/**'
      - '.github/actions/screenshots/**'
      - '.github/workflows/screenshots.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Capture and compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.base.outputs.sha }}
      ui-changed: ${{ steps.base.outputs.ui-changed }}
    steps:
      # The PR's own commit, not the merge commit GitHub makes for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find where the PR branched off
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(git merge-base "$BASE_SHA" HEAD)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- public/; then echo "ui-changed=false"; else echo "ui-changed=true"; fi >> "$GITHUB_OUTPUT"

      - id: shots
        uses: ./.github/actions/screenshots
        with:
          base: ${{ steps.base.outputs.sha }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ steps.shots.outputs.shots }}
          retention-days: 14

  # Runs apart from the PR's code with a token that can write, and only for
  # PRs from this repository: a fork's PR gets the artifact but no comment.
  comment:
    name: Comment on the PR
    needs: capture
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Trusted scripts from the base branch, not the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/screenshots
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

      - name: Publish images and update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          UI_CHANGED: ${{ needs.capture.outputs.ui-changed }}
        run: |
          shots="$RUNNER_TEMP/shots"
          if [ ! -f scripts/screenshots/report.mjs ]; then
            echo "The base branch has no screenshot scripts yet; see the artifact."
            exit 0
          fi
          images="$(bash scripts/screenshots/publish.sh "$shots" "$shots/report.json" "pr/$PR/${HEAD_SHA:0:12}")"
          flags=()
          [ "$UI_CHANGED" = true ] && flags+=(--ui-changed)
          node scripts/screenshots/report.mjs --report "$shots/report.json" --images "$images" --mode pr \
            --base-ref "$BASE_REF" "${flags[@]}" > "$RUNNER_TEMP/comment.md"

          marker='<!-- switchyard-screenshots -->'
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          fi
